[project]
name = "cv-generator"
version = "0.1.0"
description = "CV generator that tailors each résumé to the job application, with a history and PDF output"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "pillow>=13.0.0",
    "pydantic>=2.13.4",
    "pypdf>=6.21.4",
    "reflex>=0.10.1",
    "weasyprint>=70.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cv_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pdfminer-six>=20260107",
    "pypdf>=6.21.4",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
