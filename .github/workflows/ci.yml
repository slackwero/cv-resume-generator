name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # WeasyPrint renders the PDFs through these native libraries.
      - name: Install native libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      # No DYLD_FALLBACK_LIBRARY_PATH here on purpose: cv_generator/native_libs.py sets it in
      # the process, and CI should take the same path as a real user's Mac.
      - name: Install native libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install pango
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      # The first start installs the frontend, so it is slow. The app is stopped at the end
      # because a running `uv run` holds the uv cache lock, and setup-uv's post step (`uv cache
      # prune`) would wait on it until it times out. `set -m` gives the app its own process
      # group, so the whole tree (uv, reflex, bun, node) goes down together; the reflex process
      # does not exit on SIGTERM, hence the SIGKILL after a short grace period.
      # The runner's own Node is moved out of the way first: the dev mode installs its own
      # bun, so this proves a machine without Node can run the app.
      - name: Smoke test the local-only protection
        run: |
          while p=$(command -v node); do sudo mv "$p" "$p.hidden"; done
          set -m
          uv run reflex run > reflex.log 2>&1 &
          app=$!
          rc=0
          uv run python scripts/smoke_local_only.py --timeout 600 || rc=$?
          kill -TERM -- "-$app" 2>/dev/null || true
          for _ in $(seq 10); do kill -0 -- "-$app" 2>/dev/null || break; sleep 1; done
          kill -KILL -- "-$app" 2>/dev/null || true
          exit "$rc"
      - name: Show the app log
        if: failure()
        run: cat reflex.log || true

  # The launcher as a user meets it: the ZIP GitHub serves, unpacked into a folder whose path
  # has a space and an accent, with no .git, no setup-uv and no Node on the machine. The
  # start file has to find or install everything else itself.
  launcher:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # git archive writes what GitHub's "Download ZIP" would: the .gitattributes line endings,
      # the file modes, a single top folder, and nothing from .git.
      - name: Build the ZIP
        run: git archive --format=zip --prefix=cv-resume-generator-main/ -o "$RUNNER_TEMP/app.zip" HEAD
      - name: Unpack it (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/Descargas de José"
          unzip -q "$RUNNER_TEMP/app.zip" -d "$RUNNER_TEMP/Descargas de José"
      - name: Unpack it (macOS)
        if: runner.os == 'macOS'
        run: ditto -x -k "$RUNNER_TEMP/app.zip" "$RUNNER_TEMP/Descargas de José"
      - name: Unpack it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -LiteralPath "$env:RUNNER_TEMP\app.zip" -DestinationPath "$env:RUNNER_TEMP\Descargas de José"
      # A ZIP does not always keep the executable bit, and a Windows script saved with LF
      # line endings can break cmd.exe, so check both survived.
      - name: Check what survived the ZIP (Linux and macOS)
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}/Descargas de José/cv-resume-generator-main
        run: |
          test -x start.sh
          test -x start.command
          test ! -e .git
      - name: Check what survived the ZIP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}/Descargas de José/cv-resume-generator-main
        run: |
          foreach ($f in 'start.bat', 'start.ps1') {
            $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Join-Path $PWD $f)))
            if (-not $text.Contains("`r`n")) { throw "$f lost its CRLF line endings" }
          }
          if (Test-Path .git) { throw '.git should not be in the ZIP' }
      # The runner ships Node; a user's machine may not. The launcher must not need it.
      - name: Hide Node (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          while p=$(command -v node); do sudo mv "$p" "$p.hidden"; done
          ! command -v node
      - name: Hide Node (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($c in @(Get-Command node -All -ErrorAction SilentlyContinue)) {
            Move-Item -LiteralPath $c.Source -Destination "$($c.Source).hidden"
          }
          if (Get-Command node -ErrorAction SilentlyContinue) { throw 'node is still on PATH' }
      # The start files install uv with UV_NO_MODIFY_PATH=1, so later steps only find it if
      # its folder is on PATH. If the runner already has uv, the start file just uses that.
      - name: Put uv's install folder on PATH (Linux and macOS)
        if: runner.os != 'Windows'
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Put uv's install folder on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.local\bin"
      # --yes lets the launcher install what is missing (Pango, and Homebrew or MSYS2 where
      # needed) without asking. It keeps running in the background for the next steps.
      - name: Start the launcher (Linux and macOS)
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}/Descargas de José/cv-resume-generator-main
        run: |
          ./start.sh --yes --no-browser > launcher.out 2>&1 < /dev/null &
          echo $! > launcher.pid
      - name: Start the launcher (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}/Descargas de José/cv-resume-generator-main
        run: |
          $dir = $PWD.Path
          $p = Start-Process cmd.exe -ArgumentList '/c', 'start.bat', '--yes', '--no-browser' `
            -WorkingDirectory $dir `
            -RedirectStandardOutput (Join-Path $dir 'launcher.out') `
            -RedirectStandardError (Join-Path $dir 'launcher.err') `
            -PassThru -NoNewWindow
          Set-Content -Path (Join-Path $dir 'launcher.pid') -Value $p.Id
      # The launcher serves everything on one port in this mode, hence the same port twice.
      # The first start installs the frontend and, on a clean machine, the native libraries.
      - name: Smoke test the local-only protection
        working-directory: ${{ runner.temp }}/Descargas de José/cv-resume-generator-main
        run: uv run --frozen python scripts/smoke_local_only.py --frontend-port 3000 --backend-port 3000 --timeout 900
      - name: A second start finds the running app (Linux and macOS)
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}/Descargas de José/cv-resume-generator-main
        run: |
          rc=0
          ./start.sh --no-browser > second.out 2>&1 < /dev/null || rc=$?
          cat second.out
          test "$rc" -eq 0
          grep -q 'already running' second.out
      - name: A second start finds the running app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}/Descargas de José/cv-resume-generator-main
        run: |
          cmd /c start.bat --no-browser > second.out 2>&1
          $rc = $LASTEXITCODE
          Get-Content second.out
          if ($rc -ne 0) { throw "start.bat exited with $rc" }
          if (-not (Select-String -Path second.out -Pattern 'already running' -Quiet)) { throw 'no "already running" message' }
      - name: Launcher tests on this system
        working-directory: ${{ runner.temp }}/Descargas de José/cv-resume-generator-main
        run: uv run --frozen pytest tests/test_launcher_console.py tests/test_launcher_prerequisites.py tests/test_launcher_app.py tests/test_launcher_main.py
      # uv forwards SIGTERM to the launcher, which stops the whole app tree and says so. Port
      # 3000 is probed with bash's /dev/tcp because the minimal containers have no lsof.
      - name: Stop the launcher (Linux and macOS)
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}/Descargas de José/cv-resume-generator-main
        run: |
          kill -TERM "$(cat launcher.pid)"
          for _ in $(seq 30); do grep -q 'CV Generator stopped.' launcher.out && break; sleep 1; done
          grep -q 'CV Generator stopped.' launcher.out
          for _ in $(seq 10); do (exec 3<>/dev/tcp/127.0.0.1/3000) 2>/dev/null || break; sleep 1; done
          ! (exec 3<>/dev/tcp/127.0.0.1/3000) 2>/dev/null
      # Windows has no SIGTERM to send, so the whole tree goes down by force; then nothing
      # may be left listening, which would mean the tree was not the whole story.
      - name: Stop the launcher (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}/Descargas de José/cv-resume-generator-main
        run: |
          $id = [int](Get-Content launcher.pid)
          taskkill /T /F /PID $id
          if ($LASTEXITCODE -ne 0) { throw "taskkill exited with $LASTEXITCODE" }
          $deadline = (Get-Date).AddSeconds(30)
          do {
            $listening = Get-NetTCPConnection -LocalPort 3000 -State Listen -ErrorAction SilentlyContinue
            if (-not $listening) { break }
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $deadline)
          if ($listening) { throw 'something still listens on port 3000' }
      - name: Show the launcher logs
        if: failure()
        working-directory: ${{ runner.temp }}/Descargas de José/cv-resume-generator-main
        run: |
          for f in launcher.out launcher.err second.out start.log; do
            if [ -f "$f" ]; then echo "::group::$f"; cat "$f"; echo "::endgroup::"; fi
          done

  # A bare Linux with nothing installed: the launcher has to bring curl, unzip and Pango
  # itself. The jobs run as root, which is the path with no sudo. The checkout is the API
  # tarball (the images have no git), so there is no .git here either.
  clean-linux:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        container: ['ubuntu:24.04', 'fedora:latest']
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      # Desktop Ubuntu has wget but not always curl; wget is what the start file falls back
      # on, and the launcher then installs curl. Nothing else is installed on purpose.
      - name: Install wget only (Ubuntu)
        if: startsWith(matrix.container, 'ubuntu')
        run: apt-get update && apt-get install -y wget ca-certificates
      - uses: actions/checkout@v5
      - name: Put uv's install folder on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Start the launcher
        run: |
          ./start.sh --yes --no-browser > launcher.out 2>&1 < /dev/null &
          echo $! > launcher.pid
      - name: Smoke test the local-only protection
        run: uv run --frozen python scripts/smoke_local_only.py --frontend-port 3000 --backend-port 3000 --timeout 900
      - name: A second start finds the running app
        run: |
          rc=0
          ./start.sh --no-browser > second.out 2>&1 < /dev/null || rc=$?
          cat second.out
          test "$rc" -eq 0
          grep -q 'already running' second.out
      # A container's PID 1 does not reap children, so the stop is judged by the launcher's
      # last line and the closed port rather than by whether the PID is gone.
      - name: Stop the launcher
        run: |
          kill -TERM "$(cat launcher.pid)"
          for _ in $(seq 30); do grep -q 'CV Generator stopped.' launcher.out && break; sleep 1; done
          grep -q 'CV Generator stopped.' launcher.out
          for _ in $(seq 10); do (exec 3<>/dev/tcp/127.0.0.1/3000) 2>/dev/null || break; sleep 1; done
          ! (exec 3<>/dev/tcp/127.0.0.1/3000) 2>/dev/null
      - name: Show the launcher logs
        if: failure()
        run: |
          for f in launcher.out second.out start.log; do
            if [ -f "$f" ]; then echo "::group::$f"; cat "$f"; echo "::endgroup::"; fi
          done
