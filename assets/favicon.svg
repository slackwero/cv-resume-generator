    interface — a tied normal. No letters, so it holds up at 16px.
  -->
  <rect width="32" height="32" fill="#0a0a0a"/>
  <g stroke="#ffb000" stroke-width="2" fill="none">
    <path d="M4 16h13"/>
    <circle cx="22" cy="16" r="5"/>
  </g>
</svg>
